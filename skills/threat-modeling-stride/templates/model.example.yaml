# Threat model — minimal example (shape reference; replace every value)
meta:
  system: Acme Scheduler
  version: 0.1.0
  date: 2026-10-29
  source: "planning suite v1.0.0-draft (docs 03, 04, 05, 07, 08)"   # or a commit hash
  authors: [Security Architecture]
  scope_in: [web app, API, workers, database, object storage]
  scope_out: [customer SSO provider internals, physical security]
  classification: "Internal"                 # optional: shown in the page header
  status: "Draft — pending review"           # optional
  summary:                                   # optional: the executive brief, two or three paragraphs in business terms
    - "The design covers the main entry points well; the open items concern the job queue and operational hardening."
  decisions:                                 # optional: what leadership must approve; derived from the register when absent
    - ask: "Fund Redis authentication and worker re-authorization before the first customer tenant goes live."
      why: "Closes the only open High-band path to cross-tenant data."
      owner: Product owner
      by: "S03 planning"
      threats: [T-2]

boundaries:
  - id: B-1
    name: Public network
  - id: B-2
    name: Ingress / DMZ
  - id: B-3
    name: Application network
  - id: B-4
    name: Data network
  - id: B-5
    name: Third parties

elements:
  - id: E-1
    type: entity            # entity | process | store
    name: Staff user (browser)
    boundary: B-1
    principal: ROLE_STAFF
  - id: E-2
    type: entity
    name: SMTP relay
    boundary: B-5
  - id: P-1
    type: process
    name: Ingress (TLS, WAF, rate limits)
    boundary: B-2
  - id: P-2
    type: process
    name: API (FastAPI)
    boundary: B-3
    doc: "03 §1"
  - id: P-3
    type: process
    name: Worker (Celery)
    boundary: B-3
  - id: D-1
    type: store
    name: PostgreSQL
    boundary: B-4
    classification: restricted
  - id: D-2
    type: store
    name: Redis (tokens, queue)
    boundary: B-3
    classification: confidential

flows:
  - id: F-1
    from: E-1
    to: P-1
    name: HTTPS requests
    protocol: HTTPS/TLS 1.3
    data: credentials, session cookie, form data
    classification: confidential
  - id: F-2
    from: P-1
    to: P-2
    name: Proxied requests
    protocol: HTTP (private network)
    data: same as F-1 plus trace id
    classification: confidential
  - id: F-3
    from: P-2
    to: D-1
    name: SQL
    protocol: TCP/TLS
    data: all records
    classification: restricted
  - id: F-4
    from: P-2
    to: D-2
    name: Token and job writes
    protocol: TCP
    data: refresh tokens, job payloads
    classification: confidential
  - id: F-5
    from: D-2
    to: P-3
    name: Job dequeue
    protocol: TCP
    data: job payloads
    classification: confidential
  - id: F-6
    from: P-3
    to: E-2
    name: Transactional email
    protocol: SMTP/STARTTLS
    data: notification text, links
    classification: confidential

assets:
  - id: A-1
    name: Session and refresh tokens
    classification: restricted
    stored_in: [D-2]
  - id: A-2
    name: Customer records
    classification: restricted
    stored_in: [D-1]

assumptions:
  - "Ingress terminates TLS; the application network is not reachable from the internet."
  - "Workers have no outbound internet access except the SMTP relay."

threats:
  - id: T-1
    target: E-1
    category: S
    title: Session cookie theft via XSS
    description: "An attacker injects script through a rich-text field, exfiltrates the session cookie and acts as the staff user."
    likelihood: 3
    impact: 4
    existing: ["08 §7.1 CSP with no inline script", "08 §5.2 sanitize-on-write"]
    mitigation: "HttpOnly + SameSite cookies; CSP regression test in CI"
    status: mitigated
    owner: Backend lead
    refs: [CWE-79, "ASVS V3", A5]
  - id: T-2
    target: F-5
    category: T
    title: Forged job payload in the queue
    description: "A process with Redis access enqueues a job naming another tenant's object; the worker acts on it."
    likelihood: 2
    impact: 4
    existing: []
    mitigation: "Workers re-authorize every payload against the database at execution; Redis AUTH + network ACL"
    status: open
    owner: Backend lead
    sprint: S03-B2
    refs: [CWE-345]
    headline: "Background jobs can be made to act on another customer's data"   # optional, executive brief
    plain: "Anyone who can reach the job queue could make a background job act on another customer's data."     # optional, executive brief
    plain_fix: "Password-protect the queue and have every job re-check its permissions before it runs."
    effort: M
  - id: T-3
    target: P-2
    category: D
    title: Unbounded list endpoints
    description: "A client requests a page size of one million rows and exhausts the API and database."
    likelihood: 4
    impact: 2
    existing: ["00 §6 cursor pagination"]
    mitigation: "Hard cap on limit; statement timeout"
    status: mitigated
    owner: Backend lead
    refs: [CWE-770]

divergences:                   # sources that disagree; each is a finding (optional)
  - id: V-1
    between: "08 §7.1 vs 13 §3.1"
    description: "08 says the CSP has no inline script; the shipped env default allows 'unsafe-inline'."
    resolution: "Tighten the default; owner Backend lead"
    threats: [T-1]

no_threat:                     # explicit coverage decisions (element × category)
  - target: E-2
    category: R
    reason: "Third-party relay; non-repudiation is handled by our outbound log, not by the relay."
